name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run test suite
        run: python -m pytest -q
      - name: Smoke-test the CLI on both example manifests
        run: |
          mcp-audit audit examples/minimal-server.json
          test $? -eq 0
          mcp-audit audit examples/dangerous-server.json --format json > /dev/null
          test $? -eq 1
